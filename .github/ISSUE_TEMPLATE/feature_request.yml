name: Feature request
description: Propose a focused improvement to the learning engine.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the limitation or engineering problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior, interface, or algorithmic change.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Explain how the change should be measured or tested.
    validations:
      required: true
